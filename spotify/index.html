    <script>
        // Spotify Web API with PKCE (Authorization Code Flow)
        const CLIENT_ID = '7ca477aacf084c47b4416df28157c7b5';
        const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];
        const SCOPES = 'user-library-read user-follow-read playlist-read-private playlist-read-collaborative';

        let accessToken = null;
        let allAlbums = [];
        let allPlaylists = [];
        let allArtists = [];
        let currentType = 'albums';
        let isLoading = false;
        let isBackgroundUpdating = false;
        let backgroundUpdateTimeout = null;

        // DOM elements
        const loginBtn = document.getElementById('loginBtn');
        const randomBtn = document.getElementById('randomBtn');
        const statusDiv = document.getElementById('status');
        const albumsDiv = document.getElementById('albums');
        const menuToggle = document.getElementById('menuToggle');
        const menuDropdown = document.getElementById('menuDropdown');

        // PKCE helper functions
        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        }

        function base64encode(input) {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        }

        // IndexedDB cache functions
        const DB_NAME = 'SpotifyLibraryCache';
        const DB_VERSION = 2; // Increased for cache versioning
        const STORE_NAME = 'library';
        const CACHE_VERSION = 1; // Cache schema version

        async function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
            });
        }

        async function saveCacheData(userId) {
            const cacheData = {
                version: CACHE_VERSION,  // Add cache version
                userId: userId,
                albums: allAlbums,
                playlists: allPlaylists,
                artists: allArtists,
                counts: {
                    albums: allAlbums.length,
                    playlists: allPlaylists.length,
                    artists: allArtists.length
                },
                timestamp: Date.now()
            };
            
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                
                // Clear and save new data
                const clearRequest = store.clear();
                await new Promise((resolve, reject) => {
                    clearRequest.onsuccess = resolve;
                    clearRequest.onerror = reject;
                });
                
                const putRequest = store.put(cacheData, 'libraryData');
                await new Promise((resolve, reject) => {
                    putRequest.onsuccess = resolve;
                    putRequest.onerror = reject;
                });
                
                // Wait for transaction to complete
                await new Promise((resolve, reject) => {
                    transaction.oncomplete = resolve;
                    transaction.onerror = reject;
                });
                
                console.log('Cache saved to IndexedDB for user:', userId);
                console.log('Cache counts saved:', cacheData.counts);
                
                db.close();
                return true;
            } catch (e) {
                console.error('Failed to save cache to IndexedDB:', e);
                return false;
            }
        }

        async function loadCacheData() {
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                
                const request = store.get('libraryData');
                
                return new Promise((resolve) => {
                    request.onsuccess = () => {
                        const data = request.result;
                        console.log('Cache loaded from IndexedDB:', data ? 'Found' : 'Not found');
                        
                        // Check cache version
                        if (data && data.version !== CACHE_VERSION) {
                            console.log('Cache version mismatch, ignoring cache');
                            db.close();
                            resolve(null);
                            return;
                        }
                        
                        if (data?.userId) {
                            console.log('Cache belongs to user:', data.userId);
                        }
                        db.close();
                        resolve(data || null);
                    };
                    request.onerror = () => {
                        console.error('Failed to load cache from IndexedDB');
                        db.close();
                        resolve(null);
                    };
                });
            } catch (e) {
                console.error('Failed to open IndexedDB:', e);
                return null;
            }
        }

        async function clearCache() {
            try {
                const db = await openDB();
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                
                const request = store.clear();
                await new Promise((resolve, reject) => {
                    request.onsuccess = resolve;
                    request.onerror = reject;
                });
                
                db.close();
                console.log('Cache cleared from IndexedDB');
            } catch (e) {
                console.error('Failed to clear cache:', e);
            }
        }

        async function getLibraryCounts(cachedData) {
            try {
                // Get album count
                const albumResponse = await fetch('https://api.spotify.com/v1/me/albums?limit=1', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                
                if (!albumResponse.ok) {
                    if (albumResponse.status === 401) {
                        throw new Error('Token expired');
                    }
                    console.error('Album count request failed:', albumResponse.status);
                    throw new Error('Failed to get album count');
                }
                
                const albumData = await albumResponse.json();
                const albumCount = albumData.total || 0;

                // Get playlist count
                const playlistResponse = await fetch('https://api.spotify.com/v1/me/playlists?limit=1', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                
                if (!playlistResponse.ok) {
                    if (playlistResponse.status === 401) {
                        throw new Error('Token expired');
                    }
                    console.error('Playlist count request failed:', playlistResponse.status);
                    throw new Error('Failed to get playlist count');
                }
                
                const playlistData = await playlistResponse.json();
                const playlistCount = playlistData.total || 0;

                // Get artist count by fetching first page
                const artistResponse = await fetch('https://api.spotify.com/v1/me/following?type=artist&limit=1', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                
                if (!artistResponse.ok) {
                    if (artistResponse.status === 401) {
                        throw new Error('Token expired');
                    }
                    console.error('Artist count request failed:', artistResponse.status);
                    throw new Error('Failed to get artist count');
                }
                
                const artistData = await artistResponse.json();
                const artistCount = artistData.artists?.total || 0;

                console.log('Library counts from API:', { albums: albumCount, playlists: playlistCount, artists: artistCount });

                return {
                    albums: albumCount,
                    playlists: playlistCount,
                    artists: artistCount
                };
            } catch (error) {
                if (error.message === 'Token expired') {
                    throw error;
                }
                console.error('Error getting library counts:', error);
                return { albums: -1, playlists: -1, artists: -1 };
            }
        }

        // Check if user is returning from Spotify auth or has existing session
        window.addEventListener('load', async () => {
            // First check if we have a stored access token
            const storedToken = sessionStorage.getItem('spotify_access_token');
            if (storedToken) {
                accessToken = storedToken;
                try {
                    await handleSuccessfulAuth();
                } catch (error) {
                    // Token might be expired, reset to login state
                    await resetToLoginState();
                }
                return;
            }

            // Otherwise check if returning from Spotify auth
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            if (code) {
                const codeVerifier = sessionStorage.getItem('code_verifier');
                if (codeVerifier) {
                    await exchangeCodeForToken(code, codeVerifier);
                    sessionStorage.removeItem('code_verifier');
                    // Clean up URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        });

        // Event listeners
        loginBtn.addEventListener('click', loginToSpotify);
        randomBtn.addEventListener('click', getRandomItems);
        
        // Menu functionality
        menuToggle.addEventListener('click', toggleMenu);
        
        menuDropdown.addEventListener('click', (e) => {
            if (e.target.classList.contains('menu-item') && !isLoading) {
                selectMenuType(e.target.dataset.type);
            }
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-container')) {
                menuDropdown.classList.remove('show');
            }
        });

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (backgroundUpdateTimeout) {
                clearTimeout(backgroundUpdateTimeout);
            }
        });

        async function loginToSpotify() {
            const codeVerifier = generateRandomString(64);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);
            
            // Store code verifier for later use
            sessionStorage.setItem('code_verifier', codeVerifier);
            
            const authUrl = 'https://accounts.spotify.com/authorize?' +
                'client_id=' + CLIENT_ID +
                '&response_type=code' +
                '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
                '&scope=' + encodeURIComponent(SCOPES) +
                '&code_challenge_method=S256' +
                '&code_challenge=' + codeChallenge;
            
            window.location.href = authUrl;
        }

        async function exchangeCodeForToken(code, codeVerifier) {
            showStatus('Connecting to Spotify...', 'success');
            
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        code_verifier: codeVerifier,
                    }),
                });

                if (!response.ok) {
                    throw new Error('Failed to exchange code for token');
                }

                const data = await response.json();
                accessToken = data.access_token;
                
                // Store access token for session persistence
                sessionStorage.setItem('spotify_access_token', accessToken);
                
                await handleSuccessfulAuth();
            } catch (error) {
                showStatus('Error connecting to Spotify: ' + error.message, 'error');
                await resetToLoginState();
            }
        }

        async function resetToLoginState() {
            // Clear stored data
            accessToken = null;
            sessionStorage.removeItem('spotify_access_token');
            
            // Clear any pending updates
            if (backgroundUpdateTimeout) {
                clearTimeout(backgroundUpdateTimeout);
                backgroundUpdateTimeout = null;
            }
            
            // Reset UI
            loginBtn.style.display = 'inline-block';
            
            // Clear data arrays
            allAlbums = [];
            allPlaylists = [];
            allArtists = [];
            
            // Clear display
            albumsDiv.innerHTML = '';
        }

        async function getCurrentUserId() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Token expired');
                    }
                    throw new Error('Failed to get user profile');
                }
                
                const userData = await response.json();
                console.log('Current user:', userData.display_name || userData.id);
                return userData.id;
            } catch (error) {
                if (error.message === 'Token expired') {
                    await forceReauthentication();
                    return null;
                }
                console.error('Error getting user ID:', error);
                return null;
            }
        }

        async function forceReauthentication() {
            showStatus('Session expired. Please reconnect to Spotify.', 'error');
            await resetToLoginState();
        }

        async function handleSuccessfulAuth() {
            loginBtn.style.display = 'none';
            
            showStatus('Connected to Spotify! Identifying user...', 'success');
            
            // Get current user ID first
            const userId = await getCurrentUserId();
            if (!userId) {
                showStatus('Error identifying user', 'error');
                await resetToLoginState();
                return;
            }
            
            // Load existing cache (if any)
            const cachedData = await loadCacheData();
            
            // Check if cache exists and belongs to a different user
            if (cachedData && cachedData.userId !== userId) {
                console.log('Different user detected. Previous:', cachedData.userId, 'Current:', userId);
                showStatus('Different user detected. Loading fresh library...', 'success');
                
                // Clear cache and load everything fresh
                await clearCache();
                await loadAllData();
                await saveCacheData(userId);
                showStatus(`Found ${allAlbums.length} albums, ${allPlaylists.length} playlists, ${allArtists.length} artists. Click the button to start!`, 'success');
                return;
            }
            
            try {
                if (!cachedData) {
                    // No cache at all, load everything
                    showStatus('Loading library for the first time...', 'success');
                    await loadAllData();
                    await saveCacheData(userId);
                    showStatus(`Found ${allAlbums.length} albums, ${allPlaylists.length} playlists, ${allArtists.length} artists. Click the button to start!`, 'success');
                    return;
                }
                
                // Validate cached data
                if (!validateCacheData(cachedData)) {
                    console.log('Invalid cache data, loading fresh');
                    await clearCache();
                    await loadAllData();
                    await saveCacheData(userId);
                    showStatus(`Found ${allAlbums.length} albums, ${allPlaylists.length} playlists, ${allArtists.length} artists. Click the button to start!`, 'success');
                    return;
                }
                
                // Same user with cache - IMMEDIATELY load cached data so app is usable
                allAlbums = cachedData.albums || [];
                allPlaylists = cachedData.playlists || [];
                allArtists = cachedData.artists || [];
                
                const ageMinutes = Math.floor((Date.now() - cachedData.timestamp) / 60000);
                const ageHours = Math.floor(ageMinutes / 60);
                const ageDisplay = ageHours > 0 ? `${ageHours} hours` : `${ageMinutes} minutes`;
                showStatus(`Ready! Using cached library (${ageDisplay} old): ${allAlbums.length} albums, ${allPlaylists.length} playlists, ${allArtists.length} artists`, 'success');
                
                // Now check for updates in the background
                backgroundUpdateTimeout = setTimeout(async () => {
                    await performBackgroundUpdate(cachedData, userId);
                }, 100); // Small delay to ensure UI updates first
                
            } catch (error) {
                console.error('Error in handleSuccessfulAuth:', error);
                showStatus('Error loading library: ' + error.message, 'error');
                // Reset to login state on error
                await resetToLoginState();
            }
        }

        function validateCacheData(cachedData) {
            if (!cachedData) return false;
            if (!cachedData.counts) return false;
            if (!Array.isArray(cachedData.albums)) return false;
            if (!Array.isArray(cachedData.playlists)) return false;
            if (!Array.isArray(cachedData.artists)) return false;
            return true;
        }

        async function performBackgroundUpdate(cachedData, userId) {
            try {
                isBackgroundUpdating = true;
                // Don't disable buttons during the update process
                
                const currentCounts = await getLibraryCounts(cachedData);
                console.log('Background check - Current counts:', currentCounts);
                console.log('Background check - Cached counts:', cachedData.counts);
                
                const artistsCacheExpired = (Date.now() - cachedData.timestamp) > (24 * 60 * 60 * 1000);
                const albumsChanged = cachedData.counts.albums !== currentCounts.albums;
                const playlistsChanged = cachedData.counts.playlists !== currentCounts.playlists;
                const artistsChanged = cachedData.counts.artists !== currentCounts.artists;
                
                if (!albumsChanged && !playlistsChanged && !artistsChanged && !artistsCacheExpired) {
                    // Everything is up to date, no action needed
                    console.log('Cache is fully up to date');
                    isBackgroundUpdating = false;
                    return;
                }
                
                // Something needs updating
                let updateErrors = [];
                showStatus('Library changes detected, updating in background...', 'success');
                
                // Create temporary arrays for updates
                let newAlbums = [...allAlbums];
                let newPlaylists = [...allPlaylists];
                let newArtists = [...allArtists];
                
                // Load albums if changed
                if (albumsChanged) {
                    try {
                        newAlbums = await loadAlbumsData();
                    } catch (error) {
                        if (error.message === 'Token expired') {
                            throw error;
                        }
                        console.error('Failed to update albums:', error);
                        updateErrors.push('albums');
                        newAlbums = [...allAlbums]; // Keep existing data
                    }
                }
                
                // Load playlists if changed
                if (playlistsChanged) {
                    try {
                        newPlaylists = await loadPlaylistsData();
                    } catch (error) {
                        if (error.message === 'Token expired') {
                            throw error;
                        }
                        console.error('Failed to update playlists:', error);
                        updateErrors.push('playlists');
                        newPlaylists = [...allPlaylists]; // Keep existing data
                    }
                }
                
                // Load artists if changed or expired
                if (artistsChanged || artistsCacheExpired) {
                    try {
                        newArtists = await loadArtistsData();
                    } catch (error) {
                        if (error.message === 'Token expired') {
                            throw error;
                        }
                        console.error('Failed to update artists:', error);
                        updateErrors.push('artists');
                        newArtists = [...allArtists]; // Keep existing data
                    }
                }
                
                // Now disable buttons only during the save/copy operation
                setLoadingState(true);
                showStatus('Saving updates...', 'success');
                
                // Try to save to cache first
                const tempAlbums = allAlbums;
                const tempPlaylists = allPlaylists;
                const tempArtists = allArtists;
                
                allAlbums = newAlbums;
                allPlaylists = newPlaylists;
                allArtists = newArtists;
                
                const saved = await saveCacheData(userId);
                
                if (!saved) {
                    // Restore original data if save failed
                    allAlbums = tempAlbums;
                    allPlaylists = tempPlaylists;
                    allArtists = tempArtists;
                    showStatus('Failed to save updates to cache', 'error');
                } else {
                    // Successfully saved
                    if (updateErrors.length > 0) {
                        showStatus(`Library partially updated. Failed to update: ${updateErrors.join(', ')}`, 'warning');
                    } else {
                        showStatus(`Library updated! ${allAlbums.length} albums, ${allPlaylists.length} playlists, ${allArtists.length} artists`, 'success');
                    }
                }
                
            } catch (error) {
                if (error.message === 'Token expired') {
                    await forceReauthentication();
                    return;
                }
                console.error('Error during background update:', error);
                // Don't show error to user - they can continue using cached data
            } finally {
                isBackgroundUpdating = false;
                setLoadingState(false);
            }
        }

        function setLoadingState(loading) {
            isLoading = loading;
            
            // Update button states - only disable if actually loading
            randomBtn.disabled = loading;
            menuToggle.disabled = loading;
            
            // Update menu items
            document.querySelectorAll('.menu-item').forEach(item => {
                if (loading) {
                    item.classList.add('disabled');
                } else {
                    item.classList.remove('disabled');
                }
            });
        }

        async function loadAllData() {
            setLoadingState(true);
            showStatus('Loading albums...', 'success');
            
            try {
                allAlbums = await loadAlbumsData();
                showStatus('Loading playlists...', 'success');
                allPlaylists = await loadPlaylistsData();
                showStatus('Loading artists...', 'success');
                allArtists = await loadArtistsData();
            } catch (error) {
                if (error.message === 'Token expired') {
                    await forceReauthentication();
                    throw error;
                }
                console.error('Error loading data:', error);
                throw error;
            } finally {
                setLoadingState(false);
            }
        }

        async function loadAlbumsData() {
            const albums = [];
            let offset = 0;
            const limit = 50;
            
            while (true) {
                const response = await fetch(`https://api.spotify.com/v1/me/albums?limit=${limit}&offset=${offset}`, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Token expired');
                    }
                    throw new Error('Failed to load albums');
                }
                
                const data = await response.json();
                if (data.items) {
                    albums.push(...data.items);
                }
                
                if (!data.items || data.items.length < limit) break;
                offset += limit;
            }
            
            return albums;
        }

        async function loadPlaylistsData() {
            const playlists = [];
            let offset = 0;
            const limit = 50;
            
            while (true) {
                const response = await fetch(`https://api.spotify.com/v1/me/playlists?limit=${limit}&offset=${offset}`, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Token expired');
                    }
                    throw new Error('Failed to load playlists');
                }
                
                const data = await response.json();
                if (data.items) {
                    playlists.push(...data.items);
                }
                
                if (!data.items || data.items.length < limit) break;
                offset += limit;
            }
            
            return playlists;
        }

        async function loadArtistsData() {
            const artists = [];
            let after = null;
            
            while (true) {
                const url = `https://api.spotify.com/v1/me/following?type=artist&limit=50${after ? '&after=' + after : ''}`;
                const response = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Token expired');
                    }
                    throw new Error('Failed to load artists');
                }
                
                const data = await response.json();
                if (data.artists && data.artists.items) {
                    artists.push(...data.artists.items);
                }
                
                if (!data.artists || data.artists.items.length < 50) break;
                after = data.artists.cursors?.after;
                if (!after) break;
            }
            
            return artists;
        }

        function toggleMenu() {
            if (!isLoading) {
                menuDropdown.classList.toggle('show');
            }
        }

        function selectMenuType(type) {
            currentType = type;
            
            // Update active menu item
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.type === type) {
                    item.classList.add('active');
                }
            });
            
            // Update title and button text
            const typeNames = {
                'albums': 'Albums',
                'playlists': 'Playlists', 
                'artists': 'Artists'
            };
            
            // Update button text
            randomBtn.innerHTML = `<h2><span style="color: white;">♫</span> Random ${typeNames[type]} <span style="color: white;">🎲</span></h2>`;
            
            // Close menu
            menuDropdown.classList.remove('show');
            
            // Clear current display
            albumsDiv.innerHTML = '';
            statusDiv.style.display = 'none';
            
            // Immediately show random items
            getRandomItems();
        }

        function getRandomItems() {
            const currentData = {
                'albums': allAlbums,
                'playlists': allPlaylists,
                'artists': allArtists
            }[currentType];
            
            if (!currentData || currentData.length === 0) {
                showStatus(`No ${currentType} found in your library`, 'error');
                return;
            }

            // Hide status when getting random items
            statusDiv.style.display = 'none';

            const numItems = Math.min(4, currentData.length);
            
            // Get random items
            const randomItems = [];
            const usedIndices = new Set();
            
            while (randomItems.length < numItems) {
                const randomIndex = Math.floor(Math.random() * currentData.length);
                if (!usedIndices.has(randomIndex)) {
                    usedIndices.add(randomIndex);
                    randomItems.push(currentData[randomIndex]);
                }
            }
            
            displayItems(randomItems);
        }

        function displayItems(items) {
            albumsDiv.innerHTML = '';
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'album-card';
                
                let imageUrl, title, subtitle, url, releaseYear = '';
                
                if (currentType === 'albums') {
                    const album = item.album;
                    imageUrl = album.images?.[0]?.url;
                    title = album.name;
                    subtitle = album.artists?.map(artist => artist.name).join(', ') || 'Unknown Artist';
                    url = album.external_urls?.spotify;
                    releaseYear = album.release_date ? new Date(album.release_date).getFullYear() : '';
                } else if (currentType === 'playlists') {
                    imageUrl = item.images?.[0]?.url;
                    title = item.name;
                    subtitle = `by ${item.owner?.display_name || 'Unknown'}`;
                    url = item.external_urls?.spotify;
                    releaseYear = item.tracks?.total ? `${item.tracks.total} tracks` : '';
                } else if (currentType === 'artists') {
                    imageUrl = item.images?.[0]?.url;
                    title = item.name;
                    subtitle = item.genres?.slice(0, 2).join(', ') || 'Artist';
                    url = item.external_urls?.spotify;
                    releaseYear = item.followers?.total ? `${item.followers.total.toLocaleString()} followers` : '';
                }
                
                if (!imageUrl) {
                    imageUrl = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTQwIiBoZWlnaHQ9IjE0MCIgdmlld0JveD0iMCAwIDE0MCAxNDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxNDAiIGhlaWdodD0iMTQwIiBmaWxsPSIjMzMzIi8+Cjx0ZXh0IHg9IjcwIiB5PSI3MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iIGZpbGw9IiM2NjYiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjEyIj5ObyBJbWFnZTwvdGV4dD4KPC9zdmc+';
                }
                
                if (url) {
                    card.onclick = () => window.open(url, '_blank');
                }
                
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${title}" class="album-image">
                    <div class="album-title">${title}</div>
                    <div class="album-artist">${subtitle}</div>
                    ${releaseYear ? `<div class="album-year">${releaseYear}</div>` : ''}
                `;
                
                albumsDiv.appendChild(card);
            });
        }

        function showStatus(message, type = '') {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
        }
    </script>
