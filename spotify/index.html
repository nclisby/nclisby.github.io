    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1db954 0%, #191414 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 15px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .auth-section {
            margin-bottom: 40px;
        }

        .btn {
            background: #1db954;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        }

        .btn:hover {
            background: #1ed760;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .albums-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .album-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .album-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .album-image {
            width: 100%;
            max-width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .album-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .album-artist {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 6px;
        }

        .album-year {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #1db954;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }

        .success {
            background: rgba(29, 185, 84, 0.1);
            border: 1px solid rgba(29, 185, 84, 0.3);
            color: white;
        }

        @media (max-width: 768px) {
            .albums-container {
                gap: 12px;
                max-width: 100%;
                padding: 0 10px;
            }
            
            .album-card {
                padding: 12px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.95rem;
            }

            .album-image {
                max-width: 120px;
                height: 120px;
            }

            .album-title {
                font-size: 0.9rem;
            }

            .album-artist {
                font-size: 0.8rem;
            }
        }

</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span style="color: white;">♫</span> Random Albums <span style="color: white;">🎲</span></h1>
            <button id="loginBtn" class="btn">Connect to Spotify</button>
            <button id="randomBtn" class="btn" style="display: none;">🎲 Get Random Albums</button>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div id="albums" class="albums-container"></div>
    </div>

    <script>
        // Spotify Web API with PKCE (Authorization Code Flow)
        const CLIENT_ID = '7ca477aacf084c47b4416df28157c7b5';
        const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];
        const SCOPES = 'user-library-read';

        let accessToken = null;
        let allAlbums = [];

        // DOM elements
        const loginBtn = document.getElementById('loginBtn');
        const randomBtn = document.getElementById('randomBtn');
        const statusDiv = document.getElementById('status');
        const albumsDiv = document.getElementById('albums');

        // PKCE helper functions
        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        }

        function base64encode(input) {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        }

        // Check if user is returning from Spotify auth or has existing session
        window.addEventListener('load', async () => {
            // First check if we have a stored access token
            const storedToken = sessionStorage.getItem('spotify_access_token');
            if (storedToken) {
                accessToken = storedToken;
                await handleSuccessfulAuth();
                return;
            }

            // Otherwise check if returning from Spotify auth
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            if (code) {
                const codeVerifier = sessionStorage.getItem('code_verifier');
                if (codeVerifier) {
                    await exchangeCodeForToken(code, codeVerifier);
                    sessionStorage.removeItem('code_verifier');
                    // Clean up URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        });

        // Event listeners
        loginBtn.addEventListener('click', loginToSpotify);
        randomBtn.addEventListener('click', getRandomAlbums);

        async function loginToSpotify() {
            const codeVerifier = generateRandomString(64);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);
            
            // Store code verifier for later use
            sessionStorage.setItem('code_verifier', codeVerifier);
            
            const authUrl = 'https://accounts.spotify.com/authorize?' +
                'client_id=' + CLIENT_ID +
                '&response_type=code' +
                '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
                '&scope=' + encodeURIComponent(SCOPES) +
                '&code_challenge_method=S256' +
                '&code_challenge=' + codeChallenge;
            
            window.location.href = authUrl;
        }

        async function exchangeCodeForToken(code, codeVerifier) {
            showStatus('Connecting to Spotify...', 'success');
            
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        code_verifier: codeVerifier,
                    }),
                });

                if (!response.ok) {
                    throw new Error('Failed to exchange code for token');
                }

                const data = await response.json();
                accessToken = data.access_token;
                
                // Store access token for session persistence
                sessionStorage.setItem('spotify_access_token', accessToken);
                
                await handleSuccessfulAuth();
            } catch (error) {
                showStatus('Error connecting to Spotify: ' + error.message, 'error');
            }
        }

        async function handleSuccessfulAuth() {
            loginBtn.style.display = 'none';
            randomBtn.style.display = 'inline-block';
            
            showStatus('Connected to Spotify! Loading your albums...', 'success');
            
            try {
                await loadAllAlbums();
                showStatus(`Found ${allAlbums.length} albums in your library. Click "Get Random Albums" to start!`, 'success');
            } catch (error) {
                showStatus('Error loading albums: ' + error.message, 'error');
            }
        }

        async function loadAllAlbums() {
            allAlbums = [];
            let offset = 0;
            const limit = 50;
            
            while (true) {
                const response = await fetch(`https://api.spotify.com/v1/me/albums?limit=${limit}&offset=${offset}`, {
                    headers: {
                        'Authorization': 'Bearer ' + accessToken
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load albums');
                }
                
                const data = await response.json();
                allAlbums.push(...data.items);
                
                if (data.items.length < limit) {
                    break;
                }
                
                offset += limit;
                showStatus(`Loading albums... (${allAlbums.length} found so far)`, 'success');
            }
        }

        function getRandomAlbums() {
            if (allAlbums.length === 0) {
                showStatus('No albums found in your library', 'error');
                return;
            }

            // Hide status when getting random albums
            statusDiv.style.display = 'none';

            const numAlbums = Math.min(4, allAlbums.length);
            
            // Get random albums
            const randomAlbums = [];
            const usedIndices = new Set();
            
            while (randomAlbums.length < numAlbums) {
                const randomIndex = Math.floor(Math.random() * allAlbums.length);
                if (!usedIndices.has(randomIndex)) {
                    usedIndices.add(randomIndex);
                    randomAlbums.push(allAlbums[randomIndex]);
                }
            }
            
            displayAlbums(randomAlbums);
        }

        function displayAlbums(albums) {
            albumsDiv.innerHTML = '';
            
            albums.forEach(item => {
                const album = item.album;
                const albumCard = document.createElement('div');
                albumCard.className = 'album-card';
                albumCard.onclick = () => window.open(album.external_urls.spotify, '_blank');
                
                const imageUrl = album.images && album.images.length > 0 
                    ? album.images[0].url 
                    : 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgdmlld0JveD0iMCAwIDIwMCAyMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiBmaWxsPSIjMzMzIi8+Cjx0ZXh0IHg9IjEwMCIgeT0iMTAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSIgZmlsbD0iIzY2NiIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiPk5vIEltYWdlPC90ZXh0Pgo8L3N2Zz4=';
                
                const releaseYear = album.release_date ? new Date(album.release_date).getFullYear() : '';
                
                albumCard.innerHTML = `
                    <img src="${imageUrl}" alt="${album.name}" class="album-image">
                    <div class="album-title">${album.name}</div>
                    <div class="album-artist">${album.artists.map(artist => artist.name).join(', ')}</div>
                    ${releaseYear ? `<div class="album-year">${releaseYear}</div>` : ''}
                `;
                
                albumsDiv.appendChild(albumCard);
            });
        }

        function showStatus(message, type = '') {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
