    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1db954 0%, #191414 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .header {
            margin-bottom: 20px;
            position: relative;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
        }

        .spotify-icon {
            width: 52px;
            height: 52px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
            position: absolute;
            left: 0;
        }

        .header h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 10px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header h2 {
            font-size: clamp(1.2rem, 3.33333vw, 1.66666rem);
            margin-bottom: 5px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .menu-container {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 1000;
        }

        .menu-toggle {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 13px;
            font-size: 1.56rem;
            line-height: 1;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .menu-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(25, 20, 20, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            margin-top: 5px;
            display: none;
            z-index: 9999;
            min-width: 120px;
        }

        .menu-dropdown.show {
            display: block;
        }

        .menu-item {
            padding: 10px 15px;
            color: white;
            cursor: pointer;
            transition: background 0.2s ease;
            font-size: 0.9rem;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .menu-item.active {
            background: rgba(29, 185, 84, 0.3);
            color: #1ed760;
        }

        .menu-item:first-child {
            border-top-left-radius: 7px;
            border-top-right-radius: 7px;
        }

        .menu-item:last-child {
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .auth-section {
            margin-bottom: 40px;
        }

        .btn {
            background: #1db954;
            color: white;
            border: none;
            padding: 25px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 15px 10px;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        }

        .btn:hover {
            background: #1ed760;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #randomBtn {
            margin: 15px auto 10.5px auto;
        }

        #randomBtn h2 {
            margin: 0;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .albums-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .album-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .album-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .album-image {
            width: 100%;
            max-width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .album-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .album-artist {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 6px;
        }

        .album-year {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #1db954;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }

        .success {
            background: rgba(29, 185, 84, 0.1);
            border: 1px solid rgba(29, 185, 84, 0.3);
            color: white;
        }

        @media (max-width: 768px) {
            .spotify-icon {
                width: 39px;
                height: 39px;
            }

            .albums-container {
                gap: 12px;
                max-width: 100%;
                padding: 0 10px;
            }
            
            .album-card {
                padding: 12px;
            }
            
            .btn {
                padding: 19px 20px;
                font-size: 0.95rem;
            }

            .album-image {
                max-width: 120px;
                height: 120px;
            }

            .album-title {
                font-size: 0.9rem;
            }

            .album-artist {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <img src="Primary_Logo_White_RGB.svg" alt="Spotify" class="spotify-icon">
                <button id="randomBtn" class="btn"><h2><span style="color: white;">♫</span> Random Albums <span style="color: white;">🎲</span></h2></button>
                <div class="menu-container">
                    <button id="menuToggle" class="menu-toggle">⋮</button>
                    <div id="menuDropdown" class="menu-dropdown">
                        <div class="menu-item active" data-type="albums">Albums</div>
                        <div class="menu-item" data-type="playlists">Playlists</div>
                        <div class="menu-item" data-type="artists">Artists</div>
                    </div>
                </div>
            </div>
            <button id="loginBtn" class="btn">Connect to Spotify</button>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div id="albums" class="albums-container"></div>
    </div>

    <script>
        // Spotify Web API with PKCE (Authorization Code Flow)
        const CLIENT_ID = '7ca477aacf084c47b4416df28157c7b5';
        const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];
        const SCOPES = 'user-library-read user-follow-read playlist-read-private playlist-read-collaborative';

        let accessToken = null;
        let allAlbums = [];
        let allPlaylists = [];
        let allArtists = [];
        let currentType = 'albums';

        // DOM elements
        const loginBtn = document.getElementById('loginBtn');
        const randomBtn = document.getElementById('randomBtn');
        const statusDiv = document.getElementById('status');
        const albumsDiv = document.getElementById('albums');
        const menuToggle = document.getElementById('menuToggle');
        const menuDropdown = document.getElementById('menuDropdown');

        // PKCE helper functions
        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data);
        }

        function base64encode(input) {
            return btoa(String.fromCharCode(...new Uint8Array(input)))
                .replace(/=/g, '')
                .replace(/\+/g, '-')
                .replace(/\//g, '_');
        }

        // Check if user is returning from Spotify auth or has existing session
        window.addEventListener('load', async () => {
            // First check if we have a stored access token
            const storedToken = sessionStorage.getItem('spotify_access_token');
            if (storedToken) {
                accessToken = storedToken;
                try {
                    await handleSuccessfulAuth();
                } catch (error) {
                    // Token might be expired, reset to login state
                    resetToLoginState();
                }
                return;
            }

            // Otherwise check if returning from Spotify auth
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            if (code) {
                const codeVerifier = sessionStorage.getItem('code_verifier');
                if (codeVerifier) {
                    await exchangeCodeForToken(code, codeVerifier);
                    sessionStorage.removeItem('code_verifier');
                    // Clean up URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        });

        // Event listeners
        loginBtn.addEventListener('click', loginToSpotify);
        randomBtn.addEventListener('click', getRandomItems);
        
        // Menu functionality
        menuToggle.addEventListener('click', toggleMenu);
        
        menuDropdown.addEventListener('click', (e) => {
            if (e.target.classList.contains('menu-item')) {
                selectMenuType(e.target.dataset.type);
            }
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.menu-container')) {
                menuDropdown.classList.remove('show');
            }
        });

        async function loginToSpotify() {
            const codeVerifier = generateRandomString(64);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64encode(hashed);
            
            // Store code verifier for later use
            sessionStorage.setItem('code_verifier', codeVerifier);
            
            const authUrl = 'https://accounts.spotify.com/authorize?' +
                'client_id=' + CLIENT_ID +
                '&response_type=code' +
                '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
                '&scope=' + encodeURIComponent(SCOPES) +
                '&code_challenge_method=S256' +
                '&code_challenge=' + codeChallenge;
            
            window.location.href = authUrl;
        }

        async function exchangeCodeForToken(code, codeVerifier) {
            showStatus('Connecting to Spotify...', 'success');
            
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        client_id: CLIENT_ID,
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        code_verifier: codeVerifier,
                    }),
                });

                if (!response.ok) {
                    throw new Error('Failed to exchange code for token');
                }

                const data = await response.json();
                accessToken = data.access_token;
                
                // Store access token for session persistence
                sessionStorage.setItem('spotify_access_token', accessToken);
                
                await handleSuccessfulAuth();
            } catch (error) {
                showStatus('Error connecting to Spotify: ' + error.message, 'error');
                resetToLoginState();
            }
        }

        function resetToLoginState() {
            // Clear stored data
            accessToken = null;
            sessionStorage.removeItem('spotify_access_token');
            
            // Reset UI
            loginBtn.style.display = 'inline-block';
            
            // Clear data arrays
            allAlbums = [];
            allPlaylists = [];
            allArtists = [];
            
            // Clear display
            albumsDiv.innerHTML = '';
        }

        async function handleSuccessfulAuth() {
            loginBtn.style.display = 'none';
            
            showStatus('Connected to Spotify! Loading your library...', 'success');
            
            try {
                await loadAllData();
                const total = allAlbums.length + allPlaylists.length + allArtists.length;
                showStatus(`Found ${allAlbums.length} albums, ${allPlaylists.length} playlists, ${allArtists.length} artists. Click the button to start!`, 'success');
            } catch (error) {
                showStatus('Error loading library: ' + error.message, 'error');
                // Reset to login state on error
                resetToLoginState();
            }
        }

        async function loadAllData() {
            showStatus('Loading albums...', 'success');
            
            // Load albums
            allAlbums = [];
            let offset = 0;
            const limit = 50;
            
            try {
                while (true) {
                    const response = await fetch(`https://api.spotify.com/v1/me/albums?limit=${limit}&offset=${offset}`, {
                        headers: { 'Authorization': 'Bearer ' + accessToken }
                    });
                    
                    if (!response.ok) {
                        if (response.status === 401) {
                            throw new Error('Authentication failed. Please reconnect.');
                        }
                        break;
                    }
                    
                    const data = await response.json();
                    allAlbums.push(...data.items);
                    
                    if (data.items.length < limit) break;
                    offset += limit;
                }

                showStatus('Loading playlists...', 'success');

                // Load playlists
                allPlaylists = [];
                offset = 0;
                
                while (true) {
                    const response = await fetch(`https://api.spotify.com/v1/me/playlists?limit=${limit}&offset=${offset}`, {
                        headers: { 'Authorization': 'Bearer ' + accessToken }
                    });
                    
                    if (!response.ok) break;
                    
                    const data = await response.json();
                    allPlaylists.push(...data.items);
                    
                    if (data.items.length < limit) break;
                    offset += limit;
                }

                showStatus('Loading artists...', 'success');

                // Load followed artists
                allArtists = [];
                let after = null;
                
                while (true) {
                    const url = `https://api.spotify.com/v1/me/following?type=artist&limit=50${after ? '&after=' + after : ''}`;
                    const response = await fetch(url, {
                        headers: { 'Authorization': 'Bearer ' + accessToken }
                    });
                    
                    if (!response.ok) break;
                    
                    const data = await response.json();
                    allArtists.push(...data.artists.items);
                    
                    if (data.artists.items.length < 50) break;
                    after = data.artists.cursors?.after;
                    if (!after) break;
                }
            } catch (error) {
                console.error('Error loading data:', error);
                throw error;
            }
        }

        function toggleMenu() {
            menuDropdown.classList.toggle('show');
        }

        function selectMenuType(type) {
            currentType = type;
            
            // Update active menu item
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.type === type) {
                    item.classList.add('active');
                }
            });
            
            // Update title and button text
            const typeNames = {
                'albums': 'Albums',
                'playlists': 'Playlists', 
                'artists': 'Artists'
            };
            
            // Keep the menu toggle as just dots
            randomBtn.innerHTML = `<h2><span style="color: white;">♫</span> Random ${typeNames[type]} <span style="color: white;">🎲</span></h2>`;
            
            // Close menu
            menuDropdown.classList.remove('show');
            
            // Clear current display
            albumsDiv.innerHTML = '';
            statusDiv.style.display = 'none';
        }

        function getRandomItems() {
            const currentData = {
                'albums': allAlbums,
                'playlists': allPlaylists,
                'artists': allArtists
            }[currentType];
            
            if (currentData.length === 0) {
                showStatus(`No ${currentType} found in your library`, 'error');
                return;
            }

            // Hide status when getting random items
            statusDiv.style.display = 'none';

            const numItems = Math.min(4, currentData.length);
            
            // Get random items
            const randomItems = [];
            const usedIndices = new Set();
            
            while (randomItems.length < numItems) {
                const randomIndex = Math.floor(Math.random() * currentData.length);
                if (!usedIndices.has(randomIndex)) {
                    usedIndices.add(randomIndex);
                    randomItems.push(currentData[randomIndex]);
                }
            }
            
            displayItems(randomItems);
        }

        function displayItems(items) {
            albumsDiv.innerHTML = '';
            
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'album-card';
                
                let imageUrl, title, subtitle, url, releaseYear = '';
                
                if (currentType === 'albums') {
                    const album = item.album;
                    imageUrl = album.images?.[0]?.url;
                    title = album.name;
                    subtitle = album.artists.map(artist => artist.name).join(', ');
                    url = album.external_urls.spotify;
                    releaseYear = album.release_date ? new Date(album.release_date).getFullYear() : '';
                } else if (currentType === 'playlists') {
                    imageUrl = item.images?.[0]?.url;
                    title = item.name;
                    subtitle = `by ${item.owner.display_name}`;
                    url = item.external_urls.spotify;
                    releaseYear = `${item.tracks.total} tracks`;
                } else if (currentType === 'artists') {
                    imageUrl = item.images?.[0]?.url;
                    title = item.name;
                    subtitle = item.genres.slice(0, 2).join(', ') || 'Artist';
                    url = item.external_urls.spotify;
                    releaseYear = `${item.followers.total.toLocaleString()} followers`;
                }
                
                if (!imageUrl) {
                    imageUrl = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTQwIiBoZWlnaHQ9IjE0MCIgdmlld0JveD0iMCAwIDE0MCAxNDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxNDAiIGhlaWdodD0iMTQwIiBmaWxsPSIjMzMzIi8+Cjx0ZXh0IHg9IjcwIiB5PSI3MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iIGZpbGw9IiM2NjYiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjEyIj5ObyBJbWFnZTwvdGV4dD4KPC9zdmc+';
                }
                
                card.onclick = () => window.open(url, '_blank');
                
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${title}" class="album-image">
                    <div class="album-title">${title}</div>
                    <div class="album-artist">${subtitle}</div>
                    ${releaseYear ? `<div class="album-year">${releaseYear}</div>` : ''}
                `;
                
                albumsDiv.appendChild(card);
            });
        }

        function showStatus(message, type = '') {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
