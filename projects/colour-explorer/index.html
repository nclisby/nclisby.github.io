<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Colour Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --border: #2e2e38;
    --text: #e8e8f0;
    --text-muted: #6b6b80;
    --accent: #7c6aff;
    --input-bg: #13131a;
    --btn-bg: #23232d;
    --error: #ff4f4f;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    touch-action: manipulation;
  }

  header {
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .app-title {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* Swatch */
  .preview-swatch {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    transition: background 0.15s;
  }

  /* RGB unified input */
  .rgb-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .rgb-group label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  #rgbInput {
    width: 160px;
    padding: 7px 10px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }

  #rgbInput:focus {
    border-color: var(--accent);
    background: rgba(124,106,255,0.07);
  }

  #rgbInput.error {
    border-color: var(--error);
    background: rgba(255,79,79,0.08);
    color: var(--error);
  }

  /* k */
  .k-group { display: flex; align-items: center; gap: 5px; }
  .k-label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }
  .k-box {
    display: flex;
    align-items: stretch;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .k-box button {
    width: 30px;
    background: var(--btn-bg);
    border: none;
    color: var(--text);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    touch-action: manipulation;
    border-right: 1px solid var(--border);
  }
  .k-box button:last-child { border-right: none; border-left: 1px solid var(--border); }
  .k-box button:hover { background: var(--accent); color: #fff; }
  .k-box button:active { background: #5a49d6; }
  .k-box input {
    width: 42px;
    padding: 7px 2px;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
  }
  .k-box input::-webkit-outer-spin-button,
  .k-box input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* Random button */
  .btn-random {
    padding: 7px 13px;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .btn-random:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-random:active { background: #5a49d6; }

  /* Toggle */
  .toggle-group {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .toggle-group input[type="checkbox"] { display: none; }
  .toggle-track {
    width: 32px; height: 18px;
    background: var(--border);
    border-radius: 9px;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle-track::after {
    content: '';
    position: absolute;
    left: 2px; top: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: left 0.2s, background 0.2s;
  }
  .toggle-group input:checked + .toggle-track { background: var(--accent); }
  .toggle-group input:checked + .toggle-track::after { left: 16px; background: #fff; }
  .toggle-group span {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .divider {
    width: 1px; height: 24px;
    background: var(--border);
    flex-shrink: 0;
  }

  /* Canvas */
  .canvas-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  canvas {
    display: block;
    touch-action: manipulation;
  }
</style>
</head>
<body>

<header>
  <span class="app-title">Colour Explorer</span>
  <div class="controls">

    <div id="swatchPreview" class="preview-swatch"></div>
    <div class="divider"></div>

    <div class="rgb-group">
      <label for="rgbInput">RGB =</label>
      <input type="text"
             id="rgbInput"
             spellcheck="false"
             autocomplete="off"
             placeholder="#rrggbb or r,g,b">
    </div>

    <div class="divider"></div>

    <div class="k-group">
      <span class="k-label">k =</span>
      <div class="k-box">
        <button id="kDown" aria-label="Decrease k">−</button>
        <input type="number" id="kInput" min="1" max="255" value="10" inputmode="numeric">
        <button id="kUp" aria-label="Increase k">+</button>
      </div>
    </div>

    <div class="divider"></div>
    <button class="btn-random" id="btnRandom">⚄ Random</button>
    <div class="divider"></div>

    <label class="toggle-group">
      <input type="checkbox" id="textToggle" checked>
      <span class="toggle-track"></span>
      <span>labels</span>
    </label>

  </div>
</header>

<div class="canvas-container" id="canvasContainer">
  <canvas id="hexCanvas"></canvas>
</div>

<script>
const canvas    = document.getElementById('hexCanvas');
const ctx       = canvas.getContext('2d');
const container = document.getElementById('canvasContainer');

const rgbInput   = document.getElementById('rgbInput');
const kInput     = document.getElementById('kInput');
const kDown      = document.getElementById('kDown');
const kUp        = document.getElementById('kUp');
const textToggle = document.getElementById('textToggle');
const btnRandom  = document.getElementById('btnRandom');
const swatchPreview = document.getElementById('swatchPreview');

// ── State ──────────────────────────────────────────────────────────────────
let R = Math.floor(Math.random() * 256);
let G = Math.floor(Math.random() * 256);
let B = Math.floor(Math.random() * 256);
let K = 10;
let showText = true;
let hexes = [];

// ── RGB input parsing ──────────────────────────────────────────────────────
// Accepted formats:
//   Hex:    #rrggbb  #rgb  rrggbb  rgb
//   Triplet: r,g,b  or r g b  (comma or space separated)
//     - if all three values <= 1.0  → treat as ratios [0,1]
//     - otherwise                   → treat as integers [0,255]

function parseRGB(raw) {
  const s = raw.trim();

  // ── Hex formats ────────────────────────────────────────────────────────
  const hex6 = s.match(/^#?([0-9a-f]{6})$/i);
  if (hex6) {
    const n = parseInt(hex6[1], 16);
    return [(n >> 16) & 0xff, (n >> 8) & 0xff, n & 0xff];
  }

  const hex3 = s.match(/^#?([0-9a-f]{3})$/i);
  if (hex3) {
    const [, h] = hex3;
    return [
      parseInt(h[0]+h[0], 16),
      parseInt(h[1]+h[1], 16),
      parseInt(h[2]+h[2], 16),
    ];
  }

  // ── Triplet (comma and/or whitespace separated) ─────────────────────────
  const parts = s.split(/[\s,]+/).filter(Boolean);
  if (parts.length === 3) {
    const nums = parts.map(Number);
    if (nums.some(isNaN)) return null;

    // Ratio mode: all values in [0,1]
    if (nums.every(v => v >= 0 && v <= 1)) {
      return nums.map(v => Math.round(v * 255));
    }

    // Integer mode: values in [0,255]
    if (nums.every(v => v >= 0 && v <= 255)) {
      return nums.map(Math.round);
    }

    return null; // out of range
  }

  return null;
}

function rgbToDisplayString(r, g, b) {
  return `${r}, ${g}, ${b}`;
}

function syncInputFromState() {
  rgbInput.value = rgbToDisplayString(R, G, B);
  rgbInput.classList.remove('error');
}

// ── Helpers ────────────────────────────────────────────────────────────────
const clamp255 = v => Math.max(0, Math.min(255, Math.round(v)));

function toHex(r, g, b) {
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function textColor(r, g, b) {
  return (0.299*r + 0.587*g + 0.114*b) < 110 ? '#ffffff' : '#111111';
}

// ── Pointy-top hex geometry ────────────────────────────────────────────────
// circumradius = s
// centre-to-centre (adjacent) = sqrt(3)*s
// Directions (measuring from +x/east, canvas y-down):
//   +R → NE (60°),  +G → E (0°),   +B → SE (300°)
//   -R → SW (240°), -G → W (180°), -B → NW (120°)
// Bounding box of 7-hex cluster: width = 3√3·s, height = 5s

function hexPath(cx, cy, s) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (90 + 60 * i); // pointy-top: first vertex up
    ctx.lineTo(cx + s * Math.cos(angle), cy + s * Math.sin(angle));
  }
  ctx.closePath();
}

function getNeighbourDefs(s) {
  const d = Math.sqrt(3) * s;
  const dirs = [
    [+1,  0,  0,  60],
    [ 0, +1,  0,   0],
    [ 0,  0, +1, 300],
    [-1,  0,  0, 240],
    [ 0, -1,  0, 180],
    [ 0,  0, -1, 120],
  ];
  const list = [{ dr:0, dg:0, db:0, dx:0, dy:0 }];
  for (const [dr, dg, db, ang] of dirs) {
    const rad = ang * Math.PI / 180;
    list.push({ dr, dg, db, dx: d * Math.cos(rad), dy: d * Math.sin(rad) });
  }
  return list;
}

function computeSize(w, h) {
  const pad = 14;
  return Math.min((w - pad*2) / (3 * Math.sqrt(3)), (h - pad*2) / 5);
}

// ── Draw ───────────────────────────────────────────────────────────────────
function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0f0f11';
  ctx.fillRect(0, 0, w, h);

  const s    = computeSize(w, h);
  const cx   = w / 2, cy = h / 2;
  const defs = getNeighbourDefs(s);

  hexes = [];

  const items = defs.map((d, i) => ({
    hx: cx + d.dx,
    hy: cy - d.dy,   // negate dy: screen y-down, we want NE to go up visually
    r: clamp255(R + d.dr * K),
    g: clamp255(G + d.dg * K),
    b: clamp255(B + d.db * K),
    isCenter: i === 0,
  }));

  // Draw neighbours first so centre border renders on top
  for (const idx of [1,2,3,4,5,6,0]) {
    const it = items[idx];
    hexes.push({ cx: it.hx, cy: it.hy, r: it.r, g: it.g, b: it.b, size: s });
    drawHex(it.hx, it.hy, s, it.r, it.g, it.b, it.isCenter);
  }

  swatchPreview.style.background = toHex(R, G, B);
}

function drawHex(cx, cy, s, r, g, b, isCenter) {
  const hex = toHex(r, g, b);
  const tc  = textColor(r, g, b);

  hexPath(cx, cy, s);
  ctx.fillStyle = hex;
  ctx.fill();

  hexPath(cx, cy, s);
  ctx.strokeStyle = isCenter ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.14)';
  ctx.lineWidth   = isCenter ? 2.5 : 1.2;
  ctx.stroke();

  if (!showText) return;

  const hw  = Math.sqrt(3) * s;
  const fs1 = Math.max(10, Math.min(hw * 0.21, s * 0.19));
  const fs2 = Math.max(9,  fs1 * 0.82);

  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  ctx.font      = `500 ${fs1}px 'DM Mono', monospace`;
  ctx.fillStyle = tc;
  ctx.fillText(hex.toUpperCase(), cx, cy - fs1 * 0.7);

  ctx.font      = `300 ${fs2}px 'DM Mono', monospace`;
  ctx.fillStyle = tc === '#ffffff' ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.55)';
  ctx.fillText(`${r}, ${g}, ${b}`, cx, cy + fs2 * 0.9);
}

// ── Resize ─────────────────────────────────────────────────────────────────
function resize() {
  canvas.width  = container.clientWidth;
  canvas.height = container.clientHeight;
  draw();
}

// ── Hit-test ───────────────────────────────────────────────────────────────
function findHex(px, py) {
  let best = null, bestDist = Infinity;
  for (const hex of hexes) {
    const dist = Math.hypot(px - hex.cx, py - hex.cy);
    if (dist < hex.size && dist < bestDist) { bestDist = dist; best = hex; }
  }
  return best;
}

function selectHex(hex) {
  if (!hex) return;
  R = hex.r; G = hex.g; B = hex.b;
  syncInputFromState();
  draw();
}

function canvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (canvas.width  / rect.width),
    y: (clientY - rect.top)  * (canvas.height / rect.height),
  };
}

canvas.addEventListener('dblclick', e => {
  const { x, y } = canvasCoords(e.clientX, e.clientY);
  selectHex(findHex(x, y));
});

let lastTap = 0, lastTapXY = null;
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const now = Date.now();
  const { x, y } = canvasCoords(t.clientX, t.clientY);
  if (now - lastTap < 350 && lastTapXY && Math.hypot(x - lastTapXY.x, y - lastTapXY.y) < 50) {
    selectHex(findHex(x, y));
    lastTap = 0; lastTapXY = null;
  } else {
    lastTap = now; lastTapXY = { x, y };
  }
}, { passive: false });

// ── RGB input handling ─────────────────────────────────────────────────────
function commitRGBInput() {
  const result = parseRGB(rgbInput.value);
  if (result) {
    [R, G, B] = result;
    syncInputFromState(); // normalise display (e.g. ratios → integers)
    draw();
  } else {
    rgbInput.classList.add('error');
  }
}

// Clear error state as soon as user starts editing again
rgbInput.addEventListener('input', () => {
  rgbInput.classList.remove('error');
});

rgbInput.addEventListener('blur', commitRGBInput);

rgbInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    commitRGBInput();
    rgbInput.blur();
  }
});

// ── k controls ────────────────────────────────────────────────────────────
kDown.addEventListener('click', () => { K = Math.max(1, K-1); kInput.value = K; draw(); });
kUp.addEventListener('click',   () => { K = Math.min(255, K+1); kInput.value = K; draw(); });

kInput.addEventListener('change', () => {
  K = Math.max(1, Math.min(255, parseInt(kInput.value) || 10));
  kInput.value = K;
  draw();
});

// ── Other controls ─────────────────────────────────────────────────────────
textToggle.addEventListener('change', () => { showText = textToggle.checked; draw(); });

btnRandom.addEventListener('click', () => {
  R = Math.floor(Math.random() * 256);
  G = Math.floor(Math.random() * 256);
  B = Math.floor(Math.random() * 256);
  syncInputFromState();
  draw();
});

window.addEventListener('resize', resize);

// ── Init ───────────────────────────────────────────────────────────────────
syncInputFromState();
resize();
</script>
</body>
</html>
