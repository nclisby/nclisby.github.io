<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Spotify Albums</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #1db954;
            --primary-dim: #1a9e48;
            --text: #ffffff;
            --text-secondary: #b3b3b3;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 30px;
        }
        
        h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
        }
        
        .stats {
            color: var(--text-secondary);
            font-size: 0.9em;
        }
        
        .controls {
            background: var(--surface);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .search-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: var(--bg);
            color: var(--text);
            font-size: 1em;
        }
        
        .search-box input:focus {
            outline: 2px solid var(--primary);
        }
        
        .clear-filters {
            padding: 8px 16px;
            border: 1px solid var(--text-secondary);
            border-radius: 20px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .clear-filters:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .clear-filters.hidden {
            display: none;
        }
        
        .genre-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-start;
        }
        
        .genre-filter-label {
            color: var(--text-secondary);
            margin-right: 5px;
            padding-top: 5px;
        }
        
        .genre-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
        }
        
        .genre-btn {
            padding: 5px 12px;
            border: 1px solid var(--text-secondary);
            border-radius: 15px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }
        
        .genre-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .genre-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--bg);
        }
        
        .active-filters {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--bg);
            display: none;
        }
        
        .active-filters.visible {
            display: block;
        }
        
        .active-filters-label {
            color: var(--text-secondary);
            font-size: 0.85em;
            margin-bottom: 8px;
        }
        
        .active-filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .active-filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--primary-dim);
            border-radius: 12px;
            font-size: 0.85em;
            color: var(--text);
        }
        
        .active-filter-tag .remove {
            cursor: pointer;
            opacity: 0.7;
            font-weight: bold;
        }
        
        .active-filter-tag .remove:hover {
            opacity: 1;
        }
        
        .filter-mode {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
            color: var(--text-secondary);
        }
        
        .filter-mode select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--text-secondary);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.85em;
            cursor: pointer;
        }
        
        .results-count {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        
        .album-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .artist-group {
            background: var(--surface);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .artist-header {
            background: rgba(29, 185, 84, 0.1);
            padding: 12px 15px;
            font-weight: 600;
            color: var(--primary);
            border-bottom: 1px solid var(--bg);
        }
        
        .artist-albums {
            display: flex;
            flex-direction: column;
        }
        
        .album-row {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--bg);
            transition: background 0.2s;
        }
        
        .album-row:last-child {
            border-bottom: none;
        }
        
        .album-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .album-year {
            color: var(--text-secondary);
            font-size: 0.85em;
            width: 50px;
            flex-shrink: 0;
        }
        
        .album-title {
            flex: 1;
            min-width: 0;
        }
        
        .album-title a {
            color: var(--text);
            text-decoration: none;
        }
        
        .album-title a:hover {
            color: var(--primary);
            text-decoration: underline;
        }
        
        .album-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-left: 15px;
            justify-content: flex-end;
            max-width: 300px;
        }
        
        .genre-tag {
            background: var(--bg);
            color: var(--text-secondary);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.75em;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .genre-tag:hover {
            background: var(--primary);
            color: var(--bg);
        }
        
        .genre-tag.active {
            background: var(--primary-dim);
            color: var(--text);
        }
        
        @media (max-width: 700px) {
            .album-row {
                flex-wrap: wrap;
            }
            .album-genres {
                width: 100%;
                margin-left: 50px;
                margin-top: 8px;
                justify-content: flex-start;
                max-width: none;
            }
            .filter-mode {
                width: 100%;
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>

        let activeGenres = new Set();
        let searchQuery = '';
        let filterMode = 'any'; // 'any' or 'all'
        
        function renderAlbums() {
            const list = document.getElementById('albumList');
            const countEl = document.getElementById('resultsCount');
            const clearBtn = document.getElementById('clearFilters');
            const activeFiltersEl = document.getElementById('activeFilters');
            const activeTagsEl = document.getElementById('activeFilterTags');
            
            let filtered = albums;
            
            // Apply genre filter
            if (activeGenres.size > 0) {
                if (filterMode === 'all') {
                    // Album must have ALL selected genres
                    filtered = filtered.filter(a => 
                        [...activeGenres].every(g => a.genres.includes(g))
                    );
                } else {
                    // Album must have ANY of the selected genres
                    filtered = filtered.filter(a => 
                        a.genres.some(g => activeGenres.has(g))
                    );
                }
            }
            
            // Apply search filter
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(a => 
                    a.title.toLowerCase().includes(q) ||
                    a.artist.toLowerCase().includes(q) ||
                    a.genres.some(g => g.toLowerCase().includes(q))
                );
            }
            
            countEl.textContent = filtered.length;
            
            // Show/hide clear button and active filters
            const hasFilters = activeGenres.size > 0 || searchQuery;
            clearBtn.classList.toggle('hidden', !hasFilters);
            activeFiltersEl.classList.toggle('visible', activeGenres.size > 0);
            
            // Render active filter tags
            activeTagsEl.innerHTML = [...activeGenres].map(g => `
                <span class="active-filter-tag">
                    ${escapeHtml(g)}
                    <span class="remove" data-genre="${escapeHtml(g)}">&times;</span>
                </span>
            `).join('');
            
            // Add click handlers to remove tags
            activeTagsEl.querySelectorAll('.remove').forEach(el => {
                el.addEventListener('click', () => {
                    toggleGenre(el.dataset.genre);
                });
            });
            
            // Update genre button states
            document.querySelectorAll('.genre-btn').forEach(btn => {
                btn.classList.toggle('active', activeGenres.has(btn.dataset.genre));
            });
            
            // Group by artist (maintaining sort order)
            const artistGroups = new Map();
            filtered.forEach(album => {
                if (!artistGroups.has(album.artist)) {
                    artistGroups.set(album.artist, []);
                }
                artistGroups.get(album.artist).push(album);
            });
            
            // Render grouped albums
            list.innerHTML = [...artistGroups.entries()].map(([artist, artistAlbums]) => `
                <div class="artist-group">
                    <div class="artist-header">${escapeHtml(artist)}</div>
                    <div class="artist-albums">
                        ${artistAlbums.map(album => `
                            <div class="album-row">
                                <span class="album-year">${album.release_year || '—'}</span>
                                <span class="album-title">
                                    <a href="${album.spotify_url}" target="_blank">${escapeHtml(album.title)}</a>
                                </span>
                                <div class="album-genres">
                                    ${album.genres.map(g => `
                                        <span class="genre-tag ${activeGenres.has(g) ? 'active' : ''}" 
                                              data-genre="${escapeHtml(g)}">${escapeHtml(g)}</span>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            
            // Add click handlers to genre tags in album rows
            list.querySelectorAll('.genre-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    toggleGenre(tag.dataset.genre);
                });
            });
        }
        
        function toggleGenre(genre) {
            if (activeGenres.has(genre)) {
                activeGenres.delete(genre);
            } else {
                activeGenres.add(genre);
            }
            renderAlbums();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Genre filter buttons
        document.querySelectorAll('.genre-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                toggleGenre(btn.dataset.genre);
            });
        });
        
        // Search input
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderAlbums();
        });
        
        // Clear filters button
        document.getElementById('clearFilters').addEventListener('click', () => {
            activeGenres.clear();
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            renderAlbums();
        });
        
        // Filter mode selector
        document.getElementById('filterMode').addEventListener('change', (e) => {
            filterMode = e.target.value;
            renderAlbums();
        });
        
        // Initial render
        renderAlbums();
    </script>
